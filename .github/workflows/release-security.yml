name: Release security gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Test and scan the release image
        run: ./scripts/security-scan.sh

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install ruff
        run: |
          python3 -m venv "$RUNNER_TEMP/lint-venv"
          "$RUNNER_TEMP/lint-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir ruff==0.16.8
          echo "$RUNNER_TEMP/lint-venv/bin" >> "$GITHUB_PATH"
      - name: Pyflakes-level errors (undefined names, syntax, etc.)
        run: ruff check --select F --ignore F401,F841 .

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hew
          POSTGRES_PASSWORD: hew-ci-only
          POSTGRES_DB: hew_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hew -d hew_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build the release image
        run: docker build -t home-energy-watch:postgres-ci .
      - name: Postgres migration and round-trip smoke test (inside the release image)
        run: >-
          docker run --rm --network host
          -e POWER_TEST_DATABASE_URL=postgresql://hew:hew-ci-only@127.0.0.1:5432/hew_smoke
          -e POWER_TEST_REQUIRE_DATABASE=1
          home-energy-watch:postgres-ci
          python -m pytest -p no:cacheprovider -rs tests/test_postgres_smoke.py
      - name: Full test suite against Postgres (inside the release image)
        run: >-
          docker run --rm --network host
          -e POWER_TEST_POSTGRES_ADMIN_URL=postgresql://hew:hew-ci-only@127.0.0.1:5432/postgres
          home-energy-watch:postgres-ci
          python -m pytest -p no:cacheprovider -q tests/test_app.py tests/test_data_hardening.py tests/test_access_control.py tests/test_national_grid.py
