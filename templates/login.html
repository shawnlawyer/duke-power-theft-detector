{% extends "base.html" %}

{% block content %}
  <main class="app-layout auth-layout">
    <section class="section-block auth-block">
      <div class="section-header">
        <div>
          <p class="section-kicker">Sign in</p>
          <h2>Open Home Energy Watch.</h2>
          <p class="plain-note">Enter the email address tied to your account or commission access. We will send a one-time sign-in link.</p>
        </div>
      </div>

      <form
        class="account-form"
        action="{{ url_for('login_post') }}"
        method="post"
      >
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next_url or '' }}">
        <label>
          <span>Email address</span>
          <input type="email" name="email" required>
        </label>
        <div class="button-row">
          <button type="submit">Email me a sign-in link</button>
        </div>
      </form>
    </section>
  </main>
{% endblock %}
